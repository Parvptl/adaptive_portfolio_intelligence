# E5 fixed risk-aversion PPO, arm E5L (lambda = 0.0). Loaded by load_profile_experiment_config.
#
# Prespecified on 2026-11-03 before any E5 training (docs/e5_fixed_risk_aversion.md; D-089,
# Provisional (delegated)). configs/fixed_risk_low.yaml and fixed_risk_high.yaml differ ONLY in
# `label` and `reward.fixed_lambda`. Same reward implementation as E4 (D-088):
#   r = r_base - (lambda/2) * sum(net_return_t^2) over the step's own ledger rows,
# with lambda fixed (not profile-dependent). The profile input is held constant at the neutral
# convention 0.5 in both arms, so the observation (56 inputs, E4 architecture) is identical.
# Reward base (D-064), actions, accounting, costs, features, regimes and splits are unchanged.

experiment_version: 1
label: E5L

base_configuration: 4             # grid configuration 4 (lr 1e-4, n_steps 512, ent_coef 0)
seeds: [42, 43, 44, 45, 46]
profile_stream: 5

reward:
  fixed_lambda: 0.0
  risk_measure: realised_variance
  acceptance: fixed

arms:
  main:
    distribution: constant        # every dimension 0.5 in every episode (no profile sampling)
    constant: 0.5

evaluation:
  splits: [train, validation]
  policy_actions: deterministic
  profile_sets: {}
  arm_profile_sets:
    main: []                      # the centre profile (0.5, ...) only, as in training
  sweep_points: 11
  exposure_groups:
    equity: [SPY, EFA, EEM]
    bonds: [IEF, TLT, LQD]
    gold: [GLD]

output_dir: data/processed/fixed_risk_experiments
evaluation_output_dir: data/processed/fixed_risk_evaluations
