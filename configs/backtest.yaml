# Portfolio simulation and conventional baselines (milestone 4).
#
# STATUS: the conventions used here (D-007, D-009, D-015, D-023, D-031 cost basis,
# D-048 to D-060) were ACCEPTED by Parv Patel and Mandar Patil on 2026-10-19
# (docs/decision_log.md). The cost rates remain placeholders, and the data values D-006,
# D-008, D-034, D-042 and D-044 are only acknowledged as provisional.
# Portfolio constraints, initial capital, costs and the risk-free rate are read from
# configs/environment.yaml, so every strategy is simulated under identical rules.

# Where backtest runs are written: <output_dir>/<backtest_id>/ (git-ignored).
output_dir: data/processed/backtests

# Execution timing (D-048, D-013; primary lag D-055; accepted 2026-10-19). REQUIRED:
# there is no default. A decision at the close of t uses only returns dated <= t. Trades
# execute at the close of t + execution_lag_sessions (observed sessions, not calendar
# days), and the new weights earn returns from the following session onward; the
# execution-day return is never earned by the new weights.
#   1 = trade at the next observed close (primary convention for reported comparisons,
#       D-055)
#   0 = trade at the same close the decision is based on (IDEALISED sensitivity case:
#       assumes a fill at a price the signal has already used)
# To run the lag-0 sensitivity case, set 0 here (or use a copy of configs/ with
# --config-dir); the lag is part of the backtest id, so outputs never overwrite.
execution_lag_sessions: 1

# Charge transaction costs on the initial purchase from cash (D-049).
charge_initial_funding: true

# Annualisation (D-023, accepted 2026-10-19): N = 252 observed sessions per year for daily
# data. Annualised Sharpe = sqrt(252) x per-session mean / std (assumes independent
# returns). null would report per-session metrics only.
periods_per_year: 252

# Common evaluation window (milestone 4.2, PROPOSED; see docs/research_protocol.md).
# Return rows, including the decision row, that must exist before the first decision of
# every split, for ALL strategies. 126 = the longest feature window in features.yaml
# (market_drawdown), so baselines and a later feature-based agent are evaluated over
# the same dates. Only the training split is affected (validation and test already start
# well after 126 rows). The CLI refuses a value below the longest feature window.
common_start_history_sessions: 126

# Returns spanning several sessions (sessions_spanned > 1) are refused unless true.
allow_multi_session_returns: false

# Evaluated splits (D-056): the backtest evaluates train and validation only. The test
# split is reserved for the final pre-registered evaluation and is included only with the
# command-line option --include-test (deliberately not a config key, so a config file
# cannot silently enable it).

# Conventional baselines (D-053, proposal for D-010). Allocation rules use only returns
# dated <= the decision date. No regime information is used by any baseline.
# environment.constraints.max_weight applies to the TARGET weights at each execution;
# between rebalances holdings drift with prices and may exceed it (D-057).
# rebalance: daily | monthly (first observed session of each calendar month) | never
strategies:
  - name: equal_weight_monthly
    type: equal_weight            # 1/N in every asset
    rebalance: monthly
  - name: buy_and_hold_equal_weight
    type: equal_weight            # 1/N at the start, then weights drift; never rebalanced
    rebalance: never
  - name: inverse_volatility_monthly
    type: inverse_volatility      # w_i proportional to 1 / sample std of the last `lookback`
    rebalance: monthly            # returns, capped at max_weight (excess redistributed)
    lookback: 63
