# Data configuration.
#
# STATUS: PROVISIONAL. None of the values below have been validated. The data
# provider, asset universe and date range are starting points for exploration
# and must be revisited (and recorded in docs/experiment_log.md) before any
# result is reported.

# Market-data source. Provider choice is NOT final: licensing, survivorship
# bias, corporate-action handling and data quality are still to be assessed.
# Allowed values: "yfinance" (planned free source), "csv" (local files only).
provider: csv                     # PROVISIONAL: offline default so nothing needs network access

# Directory containing locally stored raw files (used when provider = "csv").
# Kept out of Git; see .gitignore.
raw_data_dir: data/raw
processed_data_dir: data/processed

# Asset universe. PROVISIONAL: a small set of liquid, diversified US-listed ETFs
# chosen only to make early development tractable. Not a validated universe;
# ETF inception dates constrain the usable history.
universe:
  - SPY   # US large-cap equities
  - QQQ   # US large-cap growth / technology
  - IWM   # US small-cap equities
  - EFA   # Developed ex-US equities
  - TLT   # Long-duration US Treasuries
  - IEF   # Intermediate US Treasuries
  - GLD   # Gold

# Full available history window (inclusive). PROVISIONAL.
# Experiment splits in experiment.yaml must lie within this window.
start_date: "2007-01-01"
end_date: "2024-12-31"

# Bar frequency. Allowed: "daily", "weekly", "monthly".
frequency: daily

# Price field to use for returns. Adjusted prices are preferred so that
# dividends and splits are reflected; exact adjustment method depends on the provider.
price_field: adj_close
