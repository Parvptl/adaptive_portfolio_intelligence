[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-portfolio-intelligence"
version = "0.1.0"
description = "Explainable, regime-aware reinforcement learning for dynamic portfolio allocation and risk management (research project)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Parv Patel" },
    { name = "Mandar Patil" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Keep runtime dependencies minimal. Add numerical / ML libraries only when a
# milestone actually needs them (see docs/roadmap.md).
dependencies = [
    "numpy>=1.26,<3",
    # pandas: dated price/return tables and CSV I/O in the market-data pipeline (D-040).
    "pandas>=2.2,<4",
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
# Optional live market data (D-008, D-041). Not needed for tests or CI.
data = [
    "yfinance>=1.7,<2",
]
# Reinforcement learning (milestone 5.2+; D-014, D-062 to D-069). Optional: the core package
# and the .[dev] CI matrix do not need it. Install it with the CPU-only PyTorch index (command
# in docs/technical_handbook.md §1), otherwise pip may pull a large CUDA build of torch.
# Bounds reviewed 2026-10-19 (dry runs for Windows and Linux, Python 3.11-3.13).
rl = [
    "gymnasium>=1.4,<2",
    "stable-baselines3>=2.9,<3",
    "torch>=2.8,<3",
]
dev = [
    # pandas moved to the runtime dependencies with milestone 2 (D-040; was dev-only, D-032).
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptive_portfolio = ["py.typed"]

# ---------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "network: tests that require network access; never run in CI",
    "rl: tests that need the optional rl extra (gymnasium, stable-baselines3, torch); skipped without it",
]

# ------------------------------------------------------------------ ruff ----
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "NPY", # numpy-specific rules
    "PTH", # prefer pathlib
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
